<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exec Schedule</title>
  <link rel="icon" type="image/svg+xml" href="pfi-logo-acronym.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
        <nav>
            <div class="nav-container">
                <div class="logo">
                    <img src="pfi-logo-acronym.svg" alt="PFI Logo" class="logo-img">
                </div>
                <ul class="nav-menu">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="#contact">Contact</a></li>
                    <li><a href="#sponsor">Sponsors</a></li>
                    <li><a href="Availability.html">Schedule</a></li>
                </ul>
            </div>
        </nav>
  </header>

  <div class="page">
    <h1>Assign the Weekly Schedule</h1>
    <p class="note">
      Each slot shows who marked themselves available this week.
    </p>

    <div class="legend" id="legend"></div>

    <div class="exec-layout">
      <div class="grid-wrap">
        <table>
          <thead>
            <tr>
              <th></th>
              <th>Mon</th>
              <th>Tue</th>
              <th>Wed</th>
              <th>Thu</th>
              <th>Fri</th>
            </tr>
          </thead>
          <tbody>
          <tr class="half" data-time="09:30"><th scope="row">9:30</th><td data-day="mon"></td><td data-day="tue"></td><td data-day="wed"></td><td data-day="thu"></td></tr>
 
          <tr data-time="10:00"><th scope="row">10:00</th><td data-day="mon"></td><td data-day="tue"></td><td data-day="wed"></td><td data-day="thu"></td></tr>
          <tr class="half" data-time="10:30"><th scope="row">10:30</th><td data-day="mon"></td><td data-day="tue"></td><td data-day="wed"></td><td data-day="thu"></td></tr>
 
          <tr data-time="11:00"><th scope="row">11:00</th><td data-day="mon"></td><td data-day="tue"></td><td data-day="wed"></td><td data-day="thu"></td></tr>
          <tr class="half" data-time="11:30"><th scope="row">11:30</th><td data-day="mon"></td><td data-day="tue"></td><td data-day="wed"></td><td data-day="thu"></td></tr>
 
          <tr data-time="12:00"><th scope="row">12:00</th><td data-day="mon"></td><td data-day="tue"></td><td data-day="wed"></td><td data-day="thu"></td></tr>
          <tr class="half" data-time="12:30"><th scope="row">12:30</th><td data-day="mon"></td><td data-day="tue"></td><td data-day="wed"></td><td data-day="thu"></td></tr>
 
          <tr data-time="13:00"><th scope="row">13:00</th><td data-day="mon"></td><td data-day="tue"></td><td data-day="wed"></td><td data-day="thu"></td></tr>
          <tr class="half" data-time="13:30"><th scope="row">13:30</th><td data-day="mon"></td><td data-day="tue"></td><td data-day="wed"></td><td data-day="thu"></td></tr>
 
          <tr data-time="14:00"><th scope="row">14:00</th><td data-day="mon"></td><td data-day="tue"></td><td data-day="wed"></td><td data-day="thu"></td></tr>
          <tr class="half" data-time="14:30"><th scope="row">14:30</th><td data-day="mon"></td><td data-day="tue"></td><td data-day="wed"></td><td data-day="thu"></td></tr>
 
          <tr data-time="15:00"><th scope="row">15:00</th><td data-day="mon"></td><td data-day="tue"></td><td data-day="wed"></td><td data-day="thu"></td></tr>
          <tr class="half" data-time="15:30"><th scope="row">15:30</th><td data-day="mon"></td><td data-day="tue"></td><td data-day="wed"></td><td data-day="thu"></td></tr>
 
          <tr data-time="16:00"><th scope="row">16:00</th><td data-day="mon"></td><td data-day="tue"></td><td data-day="wed"></td><td data-day="thu"></td></tr>
          <tr class="half" data-time="16:30"><th scope="row">16:30</th><td data-day="mon"></td><td data-day="tue"></td><td data-day="wed"></td><td data-day="thu"></td></tr>
 
          <tr data-time="17:00"><th scope="row">17:00</th><td data-day="mon"></td><td data-day="tue"></td><td data-day="wed"></td><td data-day="thu"></td></tr>
          <tr class="half" data-time="17:30"><th scope="row">17:30</th><td data-day="mon"></td><td data-day="tue"></td><td data-day="wed"></td><td data-day="thu"></td></tr>
 
        </tbody>
        </table>
      </div>

      <div class="roster" id="roster">
        <h2>Roster</h2>
      </div>
    </div>
  </div>

  <script type="module" src="exec.js"></script>
</body>
</html>
